name: Android CI

on:
  push:
    branches: [main]
    tags: ['v*', 'apk-*-debug']
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  checks:
    name: Test, Lint & Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Run debug unit tests
        run: ./gradlew testDebugUnitTest --stacktrace

      - name: Run Android lint
        run: ./gradlew lintDebug

      - name: Assemble debug APK
        run: ./gradlew assembleDebug

      - name: Upload debug APK
        uses: actions/upload-artifact@v7
        with:
          name: codex-quota-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

  windows-checks:
    name: Windows remote component tests
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Run all remote component tests
        shell: pwsh
        run: |
          $tests = @(Get-ChildItem tools/task-notifications -Filter '*.test.cjs' | ForEach-Object { $_.FullName })
          if ($tests.Count -eq 0) { throw 'Remote component tests not found.' }
          & node --test @tests
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Verify installer parsing and callback preservation
        shell: powershell
        run: ./tools/task-notifications/install-notify.test.ps1
      - name: Verify concurrent settings writes
        shell: pwsh
        run: ./tools/task-notifications/settings-file.test.ps1

  debug-release:
    name: Publish Debug APK to Release
    if: startsWith(github.ref, 'refs/tags/apk-') && endsWith(github.ref, '-debug')
    needs: [checks, windows-checks]
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Download and verify tested APK
        shell: bash
        run: |
          set -euo pipefail
          version_name="$(sed -nE 's/^[[:space:]]*versionName[[:space:]]*=[[:space:]]*"([^"]+)".*/\1/p' app/build.gradle.kts)"
          version_code="$(sed -nE 's/^[[:space:]]*versionCode[[:space:]]*=[[:space:]]*([0-9]+).*/\1/p' app/build.gradle.kts)"
          if [[ -z "${version_name}" || -z "${version_code}" || "apk-${version_name}-debug" != "${GITHUB_REF_NAME}" ]]; then
            echo "::error::Debug release tag does not match app version"
            exit 1
          fi
          mkdir -p release
          gh run download "${GITHUB_RUN_ID}" --name codex-quota-debug-apk --dir release
          apk_file="release/Codex-Link-v${version_name}-debug.apk"
          mv release/app-debug.apk "${apk_file}"
          aapt_tool=""
          signer_tool=""
          for tool in "${ANDROID_HOME}"/build-tools/*/aapt; do
            if [[ -x "${tool}" ]]; then aapt_tool="${tool}"; fi
          done
          for tool in "${ANDROID_HOME}"/build-tools/*/apksigner; do
            if [[ -x "${tool}" ]]; then signer_tool="${tool}"; fi
          done
          [[ -n "${aapt_tool}" && -n "${signer_tool}" ]]
          badging="$("${aapt_tool}" dump badging "${apk_file}")"
          package_line="$(printf '%s\n' "${badging}" | sed -n '/^package:/p')"
          [[ "${package_line}" == *"name='com.codex.quota.debug'"* ]]
          [[ "${package_line}" == *"versionCode='${version_code}'"* ]]
          [[ "${package_line}" == *"versionName='${version_name}'"* ]]
          "${signer_tool}" verify --print-certs "${apk_file}" > release/signature.txt
          (cd release && sha256sum "Codex-Link-v${version_name}-debug.apk" > "Codex-Link-v${version_name}-debug.apk.sha256")
          cp "RELEASE_NOTES_${version_name}_LINK.md" release/notes.md
          printf '\nAPK 签名证书 SHA256：`%s`\n' "$(sed -n 's/^Signer #1 certificate SHA-256 digest: //p' release/signature.txt)" >> release/notes.md

      - name: Publish APK and checksum
        shell: bash
        run: |
          set -euo pipefail
          if gh release view "${GITHUB_REF_NAME}" --json isDraft > release/existing.json 2>/dev/null; then
            [[ "$(jq -r .isDraft release/existing.json)" == true ]] || { echo '::error::Release is already published'; exit 1; }
          else
            gh release create "${GITHUB_REF_NAME}" --verify-tag --draft --title "Codex Link ${GITHUB_REF_NAME#apk-}" --notes-file release/notes.md
          fi
          gh release upload "${GITHUB_REF_NAME}" release/*.apk release/*.sha256 --clobber
          gh release edit "${GITHUB_REF_NAME}" --draft=false --latest --notes-file release/notes.md

  release:
    name: Sign & Publish Release APK
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [checks, windows-checks]
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Verify tag matches versionName
        shell: bash
        run: |
          set -euo pipefail
          version_name="$(sed -nE 's/^[[:space:]]*versionName[[:space:]]*=[[:space:]]*"([^"]+)".*/\1/p' app/build.gradle.kts)"
          if [[ -z "${version_name}" || "v${version_name}" != "${GITHUB_REF_NAME}" ]]; then
            echo "::error::Tag ${GITHUB_REF_NAME} does not match app versionName ${version_name:-<not found>}"
            exit 1
          fi

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Prepare release signing
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          for name in ANDROID_KEYSTORE_BASE64 ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD; do
            if [[ -z "${!name:-}" ]]; then
              echo "::error::Required GitHub Actions secret is not configured: ${name}"
              exit 1
            fi
          done
          umask 077
          keystore_file="${RUNNER_TEMP}/codex-quota-release.keystore"
          printf '%s' "${ANDROID_KEYSTORE_BASE64}" | base64 --decode > "${keystore_file}"
          echo "ANDROID_KEYSTORE_FILE=${keystore_file}" >> "${GITHUB_ENV}"

      - name: Assemble signed release APK
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew assembleRelease --stacktrace

      - name: Stage release APK
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release
          cp app/build/outputs/apk/release/app-release.apk "release/codex-quota-${GITHUB_REF_NAME}.apk"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          files: release/codex-quota-${{ github.ref_name }}.apk
          generate_release_notes: true
